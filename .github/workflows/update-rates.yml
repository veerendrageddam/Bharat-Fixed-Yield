name: Sync Latest Bank Deposit Rates

on:
  schedule:
    # Run every Monday at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run scraper regardless of schedule'
        required: false
        default: 'true'

concurrency:
  group: sync-bank-rates
  cancel-in-progress: true

jobs:
  update-rates:
    name: Scrape & Verify Bank Rates
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Rate Synchronization Engine
        run: npm run sync-rates

      - name: Commit & Push Changes
        run: |
          if [[ -n $(git status -s src/data/rates.json) ]]; then
            echo "Changes detected in src/data/rates.json. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/rates.json
            git commit -m "chore(rates): automated weekly bank deposit rates update [skip ci]"
            git push
            echo "Successfully updated and pushed latest rates."
          else
            echo "All bank deposit rates are current. No changes to commit."
          fi
